name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple 0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Compiler et publier
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Déterminer la version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}" -replace '^v', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publication de la version $version"

      # The tag must describe what is actually being built.
      - name: Vérifier que la version correspond au manifeste
        shell: pwsh
        run: |
          $declared = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($declared -ne "${{ steps.version.outputs.version }}") {
            throw "Cargo.toml annonce $declared mais la release vise ${{ steps.version.outputs.version }}"
          }

      - name: Chaîne d'outils
        run: rustup show

      - name: Tests
        run: cargo test --workspace --locked

      - name: Compiler
        run: cargo build --release --locked

      - name: Vérifier et empaqueter
        id: package
        shell: pwsh
        run: |
          ./scripts/verify-windows-exe.ps1

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/safe-invest.exe dist/safe-invest.exe
          $hash = (Get-FileHash dist/safe-invest.exe -Algorithm SHA256).Hash.ToLower()
          "$hash *safe-invest.exe" | Out-File -Encoding ascii dist/safe-invest.exe.sha256

      - name: Rédiger les notes de version
        shell: pwsh
        run: |
          $notes = Get-Content .github/release-notes-template.md -Raw
          $notes = $notes.Replace("{VERSION}", "${{ steps.version.outputs.version }}")
          $notes = $notes.Replace("{SIZE}", "${{ steps.package.outputs.size }}")
          $notes = $notes.Replace("{SHA256}", "${{ steps.package.outputs.sha256 }}")
          $notes | Out-File -Encoding utf8 dist/notes.md

      - name: Publier
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/safe-invest.exe dist/safe-invest.exe.sha256 --clobber
          } else {
            gh release create $tag `
              dist/safe-invest.exe dist/safe-invest.exe.sha256 `
              --title "Safe Invest ${{ steps.version.outputs.version }}" `
              --notes-file dist/notes.md `
              --target main
          }
