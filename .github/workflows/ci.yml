name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failed build should say why, not spend five minutes writing debug info.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Contrôles (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tauri draws through WebKitGTK on Linux. Installing it here means clippy
      # sees the window code too, rather than leaving it for the Windows job.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev xvfb

      - name: Chaîne d'outils
        run: rustup show && rustc --version && cargo --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (avec interface)
        run: cargo clippy --workspace --all-targets --locked

      - name: Clippy (build console)
        run: cargo clippy --workspace --all-targets --locked --no-default-features

      # The DPAPI code only exists on Windows, so a Linux clippy never sees it.
      # Type-checking the core crate against the Windows target catches a
      # mistake there in seconds instead of two minutes into the Windows job.
      # It stops at `core` because everything above it pulls in `ring`, whose
      # build script cannot cross-compile to MSVC.
      - name: Vérifier le code Windows du noyau
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy -p safe-invest-core --all-targets --locked \
            --target x86_64-pc-windows-msvc

      - name: Tests
        run: cargo test --workspace --locked

      # The interface has no build step and no package manager, but the one
      # piece of real arithmetic in it — what a goal demands per year — is
      # worth testing. Node's own runner, no install.
      - name: Tests de l'interface
        run: node --test crates/app/ui/tests/*.test.js

      - name: L'application démarre vraiment
        # The previous release compiled and then would not launch. This runs the
        # real binary under a virtual display and fails if the window dies.
        run: |
          cargo build --locked
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            ./target/debug/safe-invest --data-dir "$RUNNER_TEMP/si" --demo &
          APP=$!
          sleep 12
          if kill -0 $APP 2>/dev/null; then
            echo "La fenêtre tient debout après 12 s."
            kill $APP
          else
            echo "::error::L'application s'est arrêtée au démarrage."
            exit 1
          fi

      - name: Diagnostic
        run: cargo run --locked -- doctor --data-dir "$RUNNER_TEMP/si-doctor" --demo

  dependencies:
    name: Dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer cargo-deny et cargo-audit
        run: |
          set -euo pipefail
          DENY=0.20.2
          AUDIT=0.22.2
          curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY}/cargo-deny-${DENY}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "cargo-deny-${DENY}-x86_64-unknown-linux-musl/cargo-deny"
          curl -sSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${AUDIT}/cargo-audit-x86_64-unknown-linux-musl-v${AUDIT}.tgz" \
            | tar xz --strip-components=1 -C /usr/local/bin "cargo-audit-x86_64-unknown-linux-musl-v${AUDIT}/cargo-audit"

      # Licences, sources, versions en double et avis de sécurité. La politique
      # et les exceptions justifiées sont dans deny.toml.
      - name: cargo deny
        run: cargo-deny check

      - name: cargo audit
        run: cargo-audit audit

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Chaîne d'outils
        run: rustup show

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Compiler l'exécutable
        run: cargo build --release --locked

      # A single file is the whole point; check that it is one, and that it runs.
      - name: Vérifier l'exécutable
        shell: pwsh
        run: |
          $exe = "target/release/safe-invest.exe"
          if (-not (Test-Path $exe)) { throw "safe-invest.exe est introuvable" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "safe-invest.exe : $size Mo"
          if ($size -gt 40) { throw "l'exécutable a doublé de taille ($size Mo) — vérifier ce qui a été ajouté" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version a échoué" }
          & $exe doctor --data-dir "$env:RUNNER_TEMP\si" --demo
          if ($LASTEXITCODE -ne 0) { throw "doctor a échoué" }

      - uses: actions/upload-artifact@v7
        with:
          name: safe-invest-windows-x64
          path: target/release/safe-invest.exe
          if-no-files-found: error
          retention-days: 14
