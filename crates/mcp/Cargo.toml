[package]
name = "safe-invest-mcp"
description = "The Model Context Protocol face of Safe Invest, so an AI can play the game."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
safe-invest-core.workspace = true
safe-invest-market.workspace = true
safe-invest-service.workspace = true
anyhow.workspace = true
jiff.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "net", "rt", "macros", "time"] }
tracing.workspace = true
uuid.workspace = true
schemars = "1.2.2"
rmcp = { version = "3.2.0", features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }

# The HTTP face of the MCP server. Every one of these is already in the tree
# through reqwest, so serving a port costs compile time rather than a new
# dependency to vet.
http = "1.3.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
tower-service = "0.3.3"

[dev-dependencies]
tempfile = "3.27.0"
# Only to talk to our own loopback server in the transport tests. Same crate
# and the same feature shape the market crate already builds.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
