[package]
name = "safe-invest-app"
description = "Safe Invest — the single executable: the window, and the MCP server behind a subcommand."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# One binary, two faces. `safe-invest.exe` opens the window; `safe-invest.exe
# mcp` speaks the Model Context Protocol on stdin/stdout.
[[bin]]
name = "safe-invest"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["gui"]
# The window. Turning it off yields a console-only build of the same binary,
# which is how the CLI and the MCP server are tested on a machine with no
# webview — the Linux CI runner, for one.
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener"]

[dependencies]
safe-invest-core.workspace = true
safe-invest-market.workspace = true
safe-invest-mcp.workspace = true
safe-invest-service.workspace = true
anyhow.workspace = true
jiff.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid.workspace = true
tauri = { version = "2.11.5", optional = true, default-features = false, features = ["wry", "common-controls-v6"] }
tauri-plugin-opener = { version = "2.5.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true, features = [] }
